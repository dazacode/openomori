<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="icon/icon.png" type="image/png">
    <link rel="preload" href="fonts/gamefont.css" as="style">
    <link rel="stylesheet" href="fonts/gamefont.css">
    <title>OMORI</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; }

        /* Shown until the game draws its first screen (a few seconds; the game's own splash screens come next). */
        #boot { position: fixed; inset: 0; z-index: 2147482999; display: flex; flex-direction: column; gap: 12px;
            align-items: center; justify-content: center; background: #000; color: #cfcfd8; font: 13px system-ui, sans-serif;
            transition: opacity .3s ease; }
        #boot img { width: 72px; height: 72px; image-rendering: pixelated; opacity: .85; }
        #boot .word { font: 600 16px/1 ui-monospace, Consolas, monospace; letter-spacing: .3em; color: #e8e8ee; }
        #boot .hint { color: #7d7d8a; }
        #boot .bar { width: 180px; height: 3px; border-radius: 2px; background: #1d1d26; overflow: hidden; }
        #boot .bar i { display: block; width: 40%; height: 100%; background: #5b5bd6; animation: slide 1.1s ease-in-out infinite; }
        @keyframes slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(310%) } }
        #boot.hide { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="boot">
        <img src="icon/icon.png" alt="">
        <div class="word">OMORI</div>
        <div class="bar"><i></i></div>
        <div class="hint">Loading the game…</div>
    </div>
    <script type="module" src="/app.js"></script>
</body>
</html>
