name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach game files, decrypted game data or save files.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the mod(s) you had enabled, if any.
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Game build
      description: For example the Steam build number or version, and where your copy came from.
  - type: input
    id: env
    attributes:
      label: Browser, OS and Bun version
      placeholder: Chrome 130, Windows 11, Bun 1.3.9
  - type: textarea
    id: log
    attributes:
      label: Relevant lines of latest.log or the browser console
      render: text
